# Dokploy compose service. No domain. Host port 3100 (3000 is taken by Dokploy) is bound to the Tailscale
# interface only, so the app is reachable at http://<tailscale-name>:3100
# and nowhere else. Set TAILSCALE_IP in the Dokploy env to the VPS's 100.x address.
services:
  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:3100:3000"
    environment:
      DATABASE_URL_MAINTENANCE: postgres://app_admin:${APP_ADMIN_PASSWORD}@postgres:5432/postgres
      DATABASE_URL_META: postgres://app_admin:${APP_ADMIN_PASSWORD}@postgres:5432/db_web_meta
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://${TAILSCALE_HOSTNAME:?TAILSCALE_HOSTNAME is required}:3100
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME}
      BACKUPS_URL: http://${TAILSCALE_HOSTNAME}:4005
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
